<!doctype html>
<html lang="ht">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#13213D">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Paskle</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preload" href="fonts/atkinson-hyperlegible-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Fonts are served with the app (SIL Open Font License, see fonts/), so nothing loads from outside and they work offline. */
@font-face{font-family:"Atkinson Hyperlegible";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/atkinson-hyperlegible-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Atkinson Hyperlegible";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/atkinson-hyperlegible-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Source Serif 4";font-style:normal;font-weight:200 900;font-display:swap;src:url(fonts/source-serif-4-latin-opsz-normal.woff2) format("woff2-variations"),url(fonts/source-serif-4-latin-opsz-normal.woff2) format("woff2")}
/* Paskle look: navy and brass (a cousin of ClearImmi, not a copy).
   One signature device: the pass line, a brass tick at the passing score on every progress bar.
   Titles: Source Serif 4. Everything people read while studying: Atkinson Hyperlegible. */
:root{
  --navy:#13213D; --navy-2:#1C2E52; --on-navy:#F2F5FB; --on-navy-2:#B9C4DB;
  --brass:#E3A83A; --brass-ink:#13213D; --brass-text:#8A5800; --brass-soft:#FBF0D9;
  --bg:#F2F5FA; --surface:#FFFFFF; --fg:#16213A; --muted:#55607A; --line:#D8DEEA;
  --accent:#1F3F7A; --accent-soft:#E6ECF7; --accent-ink:#FFFFFF;
  --fill:#4C6CA6; --track:#E1E7F1;
  --ok:#17784F; --ok-bg:#E2F3EA; --bad:#B23A32; --bad-bg:#FBE7E5;
  --sun:var(--brass-text); --sun-soft:var(--brass-soft);
  --display:"Source Serif 4","Iowan Old Style",Georgia,serif;
  --body:"Atkinson Hyperlegible","Segoe UI",Roboto,Arial,sans-serif;
  --r-lg:18px; --r:12px; --r-sm:8px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --navy:#0F1A31; --hero:#17284A; --hero-line:#2A3D63; --navy-2:#1A2A4B; --on-navy:#EEF2FA; --on-navy-2:#A9B5CF;
  --brass:#E9B24A; --brass-ink:#0F1A31; --brass-text:#F0C46A; --brass-soft:#33280F;
  --bg:#0B1426; --surface:#13203A; --fg:#E9EEF8; --muted:#A3AECA; --line:#263656;
  --accent:#9DB6EA; --accent-soft:#1B2B4C; --accent-ink:#0B1426;
  --fill:#7F9DDA; --track:#22324F;
  --ok:#55C893; --ok-bg:#112C21; --bad:#F08A80; --bad-bg:#3A1A18;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --navy:#0F1A31; --hero:#17284A; --hero-line:#2A3D63; --navy-2:#1A2A4B; --on-navy:#EEF2FA; --on-navy-2:#A9B5CF;
  --brass:#E9B24A; --brass-ink:#0F1A31; --brass-text:#F0C46A; --brass-soft:#33280F;
  --bg:#0B1426; --surface:#13203A; --fg:#E9EEF8; --muted:#A3AECA; --line:#263656;
  --accent:#9DB6EA; --accent-soft:#1B2B4C; --accent-ink:#0B1426;
  --fill:#7F9DDA; --track:#22324F;
  --ok:#55C893; --ok-bg:#112C21; --bad:#F08A80; --bad-bg:#3A1A18;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 17px/1.55 var(--body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15;font-weight:600}
h1{font-size:1.9rem;letter-spacing:-.01em}
h2{font-size:1.3rem}
h3{font-size:1.08rem}
p{margin:0}
.en{display:block;color:var(--muted);font-size:.86em;font-weight:400;margin-top:2px}
.muted{color:var(--muted)}
.small{font-size:.88rem}
/* Small labels stay in sentence case: easier to read, and Kreyòl accents survive */
.eyebrow{font-size:.86rem;color:var(--muted);font-weight:700}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px;border-radius:6px}

/* Header: navy band */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--navy);color:var(--on-navy)}
.bar{max-width:660px;margin:0 auto;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;justify-content:space-between;gap:10px}
.lead{display:flex;align-items:center;gap:10px;min-width:0}
.brand{display:flex;flex-direction:column;line-height:1}
.brand b{font-family:var(--display);font-weight:700;font-size:1.6rem;letter-spacing:-.01em}
.brand b span{color:var(--brass)}
.brand small{display:none}
.tchip{display:inline-flex;align-items:center;gap:4px;border:1px solid rgba(255,255,255,.28);color:var(--on-navy);background:transparent;border-radius:999px;padding:5px 11px;font-weight:700;font-size:.85rem;cursor:pointer}
.tchip[hidden]{display:none}
.langsel{font-size:.86rem;font-weight:700;color:var(--on-navy);background:var(--navy-2);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:7px 12px;max-width:52vw;cursor:pointer}
.langsel option{color:#13213D;background:#fff}
main .langsel{color:var(--fg);background:var(--bg);border-color:var(--line);max-width:100%}
.offline{background:var(--brass-soft);color:var(--fg);font-size:.88rem;font-weight:700;text-align:center;padding:6px 16px}

main{max-width:660px;margin:0 auto;padding-top:20px;padding-bottom:calc(104px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
section{display:flex;flex-direction:column;gap:12px}
.foot{font-size:.8rem;color:var(--muted);line-height:1.5}

/* Buttons: brass is the one primary colour */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--brass);background:var(--brass);color:var(--brass-ink);font-weight:700;padding:13px 18px;border-radius:var(--r);cursor:pointer;text-align:center;line-height:1.25;min-height:50px}
.btn:active{transform:translateY(1px)}
.btn:focus-visible,.banner .btn:focus-visible{outline-color:var(--fg)}
.btn.ghost{background:var(--surface);color:var(--fg);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--fg)}
.btn.full{width:100%}
.btn.big{min-height:58px;font-size:1.08rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:420px){.actions{grid-template-columns:1fr}}
.back{border:0;background:none;color:var(--accent);font-weight:700;padding:4px 0;cursor:pointer;align-self:flex-start;text-align:left}

/* Two-up action tiles with a sub-line */
.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;cursor:pointer;min-height:76px}
.tile b{font-weight:700;line-height:1.25}
.tile span{font-size:.84rem;color:var(--muted);line-height:1.35}
.tile:hover{border-color:var(--fg)}
.tile[disabled]{opacity:.5;cursor:not-allowed}

/* The pass line */
.gauge{position:relative;height:10px;background:var(--track);border-radius:99px;margin:10px 0 6px}
.gauge i{position:absolute;left:0;top:0;bottom:0;width:var(--v,0%);background:var(--fill);border-radius:99px;transition:width .5s ease}
.gauge.pass i{background:var(--ok)}
.gauge b{position:absolute;left:var(--p,76%);top:-6px;bottom:-6px;width:3px;margin-left:-1.5px;background:var(--brass);border-radius:2px}
.gauge.sm{height:6px;margin:6px 0 2px}
.gauge.sm b{top:-4px;bottom:-4px;width:2px;margin-left:-1px}
.gauge.empty i{width:0}

/* Home hero: navy panel */
.hero{background:var(--hero,var(--navy));color:var(--on-navy);border:1px solid var(--hero-line,transparent);border-radius:var(--r-lg);padding:20px 18px 18px;gap:4px}
.hero h1{font-size:1.55rem}
.hero .en{color:var(--on-navy-2)}
.hero .muted{color:var(--on-navy-2)}
.hero .gauge{background:rgba(255,255,255,.14)}
.hero .gauge i{background:#9FB6E6}
.hero .gauge.pass i{background:#6FD3A5}
.est{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:12px}
.est b{font-family:var(--display);font-weight:700;font-size:3.2rem;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.est span{color:var(--on-navy-2);font-size:.95rem}
.passlbl{position:relative;height:18px;font-size:.8rem;color:var(--brass)}
.passlbl span{position:absolute;left:var(--p,76%);transform:translateX(-50%);white-space:nowrap;font-weight:700}
.passlbl span.r{transform:translateX(-85%)}
.hfacts{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.88rem;color:var(--on-navy-2);font-variant-numeric:tabular-nums}
.days{display:inline-flex;align-self:flex-start;gap:6px;align-items:baseline;background:rgba(255,255,255,.08);border-radius:999px;padding:3px 10px;font-size:.86rem;color:var(--on-navy-2);margin-bottom:6px}
.days b{color:var(--brass);font-size:1rem}

/* Lists and rows */
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;cursor:pointer;color:var(--fg)}
.li:first-child{border-top:0}
a.li{color:inherit;text-decoration:none}
.li:hover{background:var(--accent-soft)}
.li .cnt{font-size:.84rem;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.li.static{cursor:default}.li.static:hover{background:none}
.li.danger{color:var(--bad)}
.topic{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center;padding:13px 16px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;cursor:pointer;color:var(--fg)}
.topic:first-child{border-top:0}
.topic:hover{background:var(--accent-soft)}
.topic .gauge{grid-column:1/-1}
.topic .cnt{font-size:.84rem;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums;display:inline-flex;gap:4px;align-items:center}
.topic .cnt.ok{color:var(--ok);font-weight:700}
.topic .cnt.bad{color:var(--bad);font-weight:700}
.secthead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.secthead .back{font-size:.92rem}

.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:.8rem;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.lock{background:var(--brass-soft);color:var(--brass-text)}
.pill.topic{background:var(--accent-soft);color:var(--accent);display:inline-flex;grid-template-columns:none;padding:3px 10px;border:0;width:auto;cursor:default}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;display:flex;flex-direction:column;gap:10px}
.card.cta{flex-direction:row;justify-content:space-between;align-items:center;text-align:left;cursor:pointer;color:var(--fg);width:100%}
.card.cta:hover{border-color:var(--fg)}
.card.cta svg{color:var(--muted);flex:none}
.card .pct{font-family:var(--display);font-size:1.5rem}
.plan .pill,.card .pill{align-self:flex-start}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.86rem;color:var(--muted);font-variant-numeric:tabular-nums}
.meter{display:block;height:6px;background:var(--track);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--fill);border-radius:99px}
.banner{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 16px;border-radius:var(--r-lg);background:var(--brass-soft);color:var(--fg)}
.banner .btn{min-height:44px;padding:10px 16px}
.banner.soft{background:var(--accent-soft);border:0;width:100%;text-align:left;cursor:pointer;font-weight:700;color:var(--accent)}

/* Quiz */
body.focus nav.tabs{display:none}
body.focus main{padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
.qtop{display:flex;justify-content:space-between;align-items:center;gap:10px}
.qcount{font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted)}
.qcount b{color:var(--fg)}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.timer{font-family:var(--display);font-weight:700;font-size:1.15rem;font-variant-numeric:tabular-nums;padding:2px 10px;border-radius:99px;background:var(--accent-soft)}
.timer.low{color:var(--bad);background:var(--bad-bg)}
.segs{display:flex;gap:3px}
.segs i{flex:1;height:5px;border-radius:9px;background:var(--track)}
.segs i.ok{background:var(--ok)}.segs i.bad{background:var(--bad)}.segs i.on{background:var(--fg)}.segs i.done{background:var(--fill)}
.qprog{height:5px;background:var(--track);border-radius:9px;overflow:hidden}.qprog i{display:block;height:100%;background:var(--fill)}
.qtext{font-size:1.22rem;font-weight:700;line-height:1.42}
.qtext .en{font-size:.82em;margin-top:6px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer;line-height:1.4;color:var(--fg);min-height:56px}
.opt:hover:not([disabled]){border-color:var(--fg)}
.opt .ltr{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line);font-weight:700;font-size:.9rem;color:var(--muted)}
.opt[disabled]{cursor:default}
.opt.sel{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.opt.sel .ltr{background:var(--fg);border-color:var(--fg);color:var(--surface)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.ok .ltr{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt.bad .ltr{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt.dim{opacity:.6}
.fb{border-left:4px solid var(--ok);background:var(--surface);border-radius:0 var(--r) var(--r) 0;padding:14px 16px;display:flex;flex-direction:column;gap:10px;scroll-margin-bottom:110px}
.fb.no{border-left-color:var(--bad)}
.fb h3{font-family:var(--body);font-size:1.05rem}
.sign{display:block;width:118px;height:118px;margin:2px 0 0}.sign.sm{width:64px;height:64px}.gsign{float:right;width:84px;height:84px;margin:0 0 8px 14px}
.fb .cite,.rv .cite{margin:0}
.faqh{margin:14px 0 2px;font-size:1.15rem}
.fb.yes h3{color:var(--ok)}.fb.no h3{color:var(--bad)}
.term{display:inline-flex;flex-wrap:wrap;gap:6px;align-items:baseline;font-size:.9rem;background:var(--accent-soft);border-radius:var(--r-sm);padding:7px 11px;align-self:flex-start}
.term b{font-weight:700}
.listen{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 13px;font-size:.86rem;font-weight:700;color:var(--accent);cursor:pointer}
.listen svg{width:16px;height:16px}
.qbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.qbar .in{max-width:628px;margin:0 auto;display:flex;gap:10px}
.qbar .btn{flex:1}
.qbar .hint{flex:1;display:flex;align-items:center;justify-content:center;min-height:50px;color:var(--muted);font-size:.92rem;text-align:center}

/* Results */
.score{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.score b{font-family:var(--display);font-size:3.2rem;font-weight:700;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
.verdict{font-size:1.05rem;font-weight:700;color:var(--fg)}
.verdict.ok{color:var(--ok)}
.review{display:flex;flex-direction:column;gap:12px}
.rv{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.rv .yours{color:var(--bad)}
.rv .right{color:var(--ok);font-weight:700}
details.mist>summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);font-weight:700}
details.mist>summary::-webkit-details-marker{display:none}
details.mist[open]>summary{margin-bottom:12px}
details.mist>summary svg{transition:transform .2s}
details.mist[open]>summary svg{transform:rotate(90deg)}

/* Learn */
details.lesson{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg)}
details.lesson summary{cursor:pointer;padding:14px 16px;list-style:none;display:flex;justify-content:space-between;gap:10px;align-items:center}
details.lesson summary::-webkit-details-marker{display:none}
details.lesson[open] summary{border-bottom:1px solid var(--line)}
.steps{margin:0;padding:14px 16px 16px 40px;display:flex;flex-direction:column;gap:10px}
.note{margin:0 16px 16px;padding:10px 12px;border-radius:var(--r-sm);background:var(--accent-soft);font-size:.92rem}
.locked{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;border:1px dashed var(--line);border-radius:var(--r-lg);background:none;width:100%;text-align:left;cursor:pointer;color:var(--fg)}
.chnum{font-family:var(--display);font-weight:700;font-size:1.25rem;color:var(--muted);min-width:1.6em;font-variant-numeric:tabular-nums}
.chrow{display:flex;align-items:center;gap:12px;min-width:0}
.gsec.hl{border-left:4px solid var(--brass);padding-left:14px;margin-left:-18px}
.gsec{gap:10px;scroll-margin-top:90px}
.gsec p{max-width:65ch}
.gl-list{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px;max-width:65ch}
.gl-list li::marker{color:var(--brass-text);font-weight:700}
.cite{font-size:.8rem;color:var(--muted)}
.cite a,.gl a,.note a{color:var(--accent)}
.search{width:100%;padding:12px 14px;border-radius:var(--r);border:1.5px solid var(--line);background:var(--surface);color:var(--fg)}
.search:focus{border-color:var(--fg);outline:none}
.gl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:11px 16px;border-top:1px solid var(--line)}
.gl:first-child{border-top:0}
.gl .tag{font-size:.74rem;font-weight:700;color:var(--muted)}

/* Plans */
.plans{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:520px){.plans{grid-template-columns:1fr}}
.plan{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;display:flex;flex-direction:column;gap:8px}
.plan.hi{border:2px solid var(--brass)}
.price{font-family:var(--display);font-weight:700;font-size:1.9rem;line-height:1;font-variant-numeric:tabular-nums}
.price small{font-family:var(--body);font-size:.86rem;font-weight:400;color:var(--muted)}
.plan ul{margin:0;padding-left:18px;font-size:.92rem;display:flex;flex-direction:column;gap:4px}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg)}
table{border-collapse:collapse;width:100%;font-size:.9rem;font-variant-numeric:tabular-nums}
th,td{padding:10px 14px;text-align:left;border-top:1px solid var(--line)}
thead th{border-top:0;font-size:.84rem;color:var(--muted)}

/* Bottom tabs */

/* Onboarding and exam picker */
.dots{display:flex;gap:6px}.dots i{width:28px;height:5px;border-radius:9px;background:var(--line)}.dots i.on{background:var(--brass)}

.choice .code{min-width:64px;font-size:1.35rem}

.code{font-family:var(--display);font-weight:700;font-size:1.7rem;color:var(--fg);line-height:1}

.area{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}.area:first-child{border-top:0}
.date{color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:var(--r-sm);padding:5px 8px}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.88rem}.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.mini{display:block;height:4px;width:120px;max-width:100%;background:var(--track);border-radius:9px;margin-top:6px;overflow:hidden}.mini i{display:block;height:100%;background:var(--ok)}

/* CNA */
q("cna1","cna","inf",1,1,["hand hygiene","ijyèn men"],
 ["Lè w ap lave men w, konbyen tan pou w fwote ak savon?","Anviwon 5 segonn","Omwen 20 segonn","Sèlman si men w sal","Sèlman lè w fin travay","Fwote omwen 20 segonn: pla men, do men, ant dwèt yo ak anba zong yo. Rense, epi seche ak yon sèvyèt papye pwòp."],
 ["When washing your hands, how long should you scrub with soap?","About 5 seconds","At least 20 seconds","Only if your hands look dirty","Only at the end of your shift","Scrub at least 20 seconds: palms, backs of hands, between fingers and under nails. Rinse, then dry with a clean paper towel."]);
q("cna2","cna","inf",0,1,["gloves","gan"],
 ["Lè w ap retire ekipman pwoteksyon (PPE), kisa ou retire an premye?","Gan yo","Mask la","Rad izolasyon an","Linèt pwoteksyon yo","Gan yo pi kontamine, se pou sa yo soti an premye. Lave men w apre w fin retire tout PPE yo."],
 ["When taking off PPE, which item do you usually remove first?","Gloves","Mask","Gown","Goggles","Gloves are the most contaminated, so they come off first. Clean your hands after removing all PPE."]);
q("cna3","cna","safe",0,1,["fall","tonbe"],
 ["Yon rezidan kòmanse tonbe pandan w ap ede l mache. Kisa pou w fè?","Desann li dousman atè epi pwoteje tèt li","Kenbe l kanpe kèlkeswa sa k rive","Lage l epi kouri chèche èd","Rale l leve pa bra li","Louvri pye w, rale rezidan an toupre w, epi glise l dousman atè. Rete avè l, rele enfimyè a, epi pa deplase l jiskaske yo egzamine l."],
 ["A resident starts to fall while you are helping them walk. What should you do?","Ease them to the floor and protect their head","Hold them up no matter what","Let go and run for help","Pull them up by the arm","Widen your stance, bring the resident close, and slide them gently to the floor. Stay with them, call the nurse, and do not move them until they are checked."]);
q("cna4","cna","safe",2,1,["call light","bouton apèl"],
 ["Apre w fin bay swen nan kabann, nan ki pozisyon pou w kite kabann nan?","Nan pozisyon ki pi wo a","Wotè senti w","Nan pozisyon ki pi ba a, ak wou yo bloke","Kote fanmi an vle","Yon kabann ki ba epi ki bloke diminye risk blesi si rezidan an eseye leve. Kite bouton apèl la toupre l tou."],
 ["After giving care in bed, where should you leave the bed?","At the highest position","At your waist height","In the lowest position, wheels locked","Wherever the family wants","A low, locked bed lowers the risk of injury if the resident tries to get up. Also leave the call light within reach."]);
q("cna5","cna","rights",1,1,["resident rights","dwa rezidan"],
 ["Yon rezidan refize benyen. Kisa pou w fè?","Benyen l kanmenm","Respekte chwa li epi di enfimyè a","Mande fanmi an fòse l","Kite sa epi pa di anyen","Rezidan yo gen dwa refize swen. Mande l poukisa, pwopoze yon lòt lè, epi rapòte refi a bay enfimyè a."],
 ["A resident refuses a bath. What should you do?","Give the bath anyway","Respect the choice and tell the nurse","Ask the family to force them","Skip it and say nothing","Residents have the right to refuse care. Ask why, offer another time, and report the refusal to the nurse."]);
q("cna6","cna","care",0,0,["affected (weak) side","bò ki fèb la"],
 ["Yon rezidan fèb sou bò dwat. Lè w ap abiye l, ki bra ki antre nan chemiz la an premye?","Bra ki fèb la (dwat)","Bra ki fò a (goch)","Sa pa fè okenn diferans","Okenn; se yon wòb lopital sèlman","Abiye bò ki fèb la an premye, epi dezabiye bò ki fò a an premye. Konsa bra ki fèb la pa pliye yon fason ki fè l mal."],
 ["A resident has weakness on the right side. When dressing them, which arm goes into the shirt first?","The weak (right) arm","The strong (left) arm","It does not matter","Neither; use a hospital gown only","Dress the weak side first and undress the strong side first. This keeps the weak arm from bending in a painful way."]);
q("cna7","cna","care",1,0,["perineal care","swen pati entim"],
 ["Pandan swen pati entim (perineal care) pou yon rezidan fanm, nan ki direksyon ou siye?","Depi dèyè rive devan","Depi devan rive dèyè","An wonn","Nenpòt direksyon si w dous","Siye depi devan rive dèyè, ak yon pati pwòp twal la chak fwa. Sa anpeche mikwòb dèyè yo rive nan kanal pipi a."],
 ["During perineal care for a female resident, which way do you wipe?","Back to front","Front to back","In circles","Any direction, if gentle","Wipe front to back, using a clean part of the cloth for each stroke. This keeps bacteria from the anus away from the urinary tract."]);
q("cna8","cna","vitals",1,0,["fever","lafyèv"],
 ["Ki tanperati nòmal nan bouch pou yon granmoun?","96.0°F (35.6°C)","98.6°F (37°C)","100.4°F (38°C)","102°F (38.9°C)","Anviwon 98.6°F nòmal. Rapòte 100.4°F oswa plis bay enfimyè a, paske sa ka vle di lafyèv."],
 ["What is a normal oral temperature for an adult?","96.0°F (35.6°C)","98.6°F (37°C)","100.4°F (38°C)","102°F (38.9°C)","About 98.6°F is normal. Report 100.4°F or higher to the nurse, since it can mean a fever."]);
q("cna9","cna","vitals",1,0,["pulse","pou"],
 ["Ki nivo pou nòmal pou yon granmoun k ap repoze?","40–60 batman pa minit","60–100 batman pa minit","100–140 batman pa minit","140–180 batman pa minit","Konte pou radyal la pandan 60 segonn konplè. Rapòte yon pou ki anba 60 oswa plis pase 100 bay enfimyè a."],
 ["What is the normal resting pulse range for an adult?","40–60 beats per minute","60–100 beats per minute","100–140 beats per minute","140–180 beats per minute","Count the radial pulse for a full 60 seconds. Report a pulse under 60 or over 100 to the nurse."]);
q("cna10","cna","safe",2,0,["choking","toufe"],
 ["Pou diminye risk toufe, kijan yon rezidan dwe chita pou l manje?","Kouche plat","Panche a 30 degre","Chita dwat, toupre 90 degre","Kouche sou kote","Chita dwat ede manje desann nan bon chemen. Veye siy toufe, tankou touse oswa yon vwa ki sonnen mouye."],
 ["To lower the risk of choking, how should a resident sit while eating?","Lying flat","Reclined at 30 degrees","Upright, close to 90 degrees","On their side","Sitting upright helps food go down the right way. Watch for signs of choking, such as coughing or a wet-sounding voice."]);
q("cna11","cna","care",1,0,["pressure injury (bedsore)","blesi presyon (eska)"],
 ["Yon rezidan ki pa ka bouje nan kabann, chak konbyen tan pou w chanje pozisyon l omwen?","Chak 30 minit","Chak 2 èdtan","De fwa pa jou","Yon fwa pa woulman","Vire l omwen chak 2 èdtan pou retire presyon sou zo yo epi ede anpeche blesi presyon (eska)."],
 ["A resident who cannot move in bed should be repositioned at least how often?","Every 30 minutes","Every 2 hours","Twice a day","Once a shift","Turning at least every 2 hours relieves pressure on bony areas and helps prevent pressure injuries (bedsores)."]);
q("cna12","cna","comm",2,0,["hearing aid","aparèy pou tande"],
 ["Ki pi bon fason pou w pale ak yon rezidan ki gen pwoblèm tande?","Rele fò pou l tande","Pale dèyè do l","Gade l nan figi epi pale klè, pa twò vit","Ekri tout bagay olye w pale","Kanpe anfas rezidan an kote ki gen bon limyè, atire atansyon l anvan, epi pale klè. Verifye aparèy pou tande yo an plas epi yo mache."],
 ["What is the best way to speak with a resident who has hearing loss?","Shout so they can hear","Speak from behind them","Face them and speak clearly at a normal pace","Write everything instead of talking","Face the resident in good light, get their attention first, and speak clearly. Check that hearing aids are in and working."]);
q("cna13","cna","rights",3,0,["confidentiality","konfidansyalite"],
 ["Ak ki moun ou ka pataje enfòmasyon sante yon rezidan?","Zanmi w, si w pa di non l","Lòt rezidan","Nenpòt moun ki mande ak politès","Sèlman manm ekip swen ki bezwen l pou bay swen","Lwa sou konfidansyalite (HIPAA) pwoteje enfòmasyon sante. Pataje l sèlman ak anplwaye ki bezwen l pou bay swen, epi pa janm poste anyen sou rezidan yo sou entènèt."],
 ["Who can you share a resident's health information with?","Your friends, if you leave out the name","Other residents","Anyone who asks politely","Only care team members who need it to give care","Privacy law (HIPAA) protects health information. Share it only with staff who need it to give care, and never post about residents online."]);

/* CNA: Infection Control chapter check (guide g-cna-inf) */
q("cna14","cna","inf",1,1,["chain of infection","chèn enfeksyon"],
 ["Lave men w kase sitou ki maiyon nan chèn enfeksyon an?","Mikwòb la","Mòd transmisyon","Moun ki fasil pran l","Rezèvwa","Men pote mikwòb de yon moun a yon lòt. Ijyèn men anpeche mikwòb la vwayaje, kidonk li kase mòd transmisyon an."],
 ["Washing your hands mainly breaks which link of the chain of infection?","Infectious agent","Mode of transmission","Susceptible host","Reservoir","Hands carry germs from person to person. Hand hygiene stops the germ from traveling, which breaks the mode of transmission."]);
q("cna15","cna","inf",2,1,["alcohol-based hand sanitizer","dezenfektan men ak alkòl"],
 ["Ki lè ou dwe sèvi ak savon ak dlo olye dezenfektan men?","Apre w pran pou","Anvan w antre nan nenpòt chanm","Lè yon rezidan gen C. diff","Chak fwa; dezenfektan pa janm pèmèt","Dezenfektan pa touye espò C. diff yo byen, kidonk lave ak savon ak dlo. Sèvi ak savon tou lè men w sal yon fason ou ka wè."],
 ["When must you use soap and water instead of hand sanitizer?","After taking a pulse","Before entering any room","When a resident has C. diff","Every time; sanitizer is never allowed","Sanitizer does not reliably kill C. diff spores, so wash with soap and water. Also use soap when your hands are visibly soiled."]);
q("cna16","cna","inf",1,1,["droplet precautions","prekosyon gout"],
 ["Yon rezidan ki gen grip sou prekosyon gout (droplet). Kisa ou ajoute sou prekosyon estanda yo?","Yon respiratè ak yon chanm espesyal","Yon mask","Anyen anplis","Kouvèti soulye sèlman","Prekosyon gout ajoute yon mask, paske gout touse ak estènye ka vwayaje anviwon 6 pye."],
 ["A resident with the flu is on droplet precautions. What do you add to standard precautions?","A respirator and a special room","A mask","Nothing extra","Shoe covers only","Droplet precautions add a mask, because droplets from coughs and sneezes can travel about 6 feet."]);
q("cna17","cna","inf",3,1,["personal protective equipment (PPE)","ekipman pwoteksyon (PPE)"],
 ["Lè w ap mete PPE, kisa ou mete an dènye?","Rad izolasyon","Mask","Linèt","Gan","Mete rad izolasyon, mask, linèt oswa visyè, epi gan an dènye, rale yo sou manch rad la."],
 ["When putting on PPE, which item goes on last?","Gown","Mask","Goggles","Gloves","Put on the gown, mask, goggles or face shield, then gloves last, pulled over the gown cuffs."]);
q("cna18","cna","inf",0,1,["urinary tract infection (UTI)","enfeksyon nan kanal pipi"],
 ["Yon rezidan 85 an gen yon enfeksyon nan kanal pipi. Ki siy ou ka remake olye lafyèv?","Konfizyon ki fèk parèt","Pi bon apeti","Respirasyon ki pi dousman","Sik nan san ki pi ba","Granmoun souvan pa gen lafyèv. Konfizyon ki fèk parèt oswa feblès toudenkou ka premye siy lan. Rapòte l bay enfimyè a touswit."],
 ["An 85-year-old resident has a urinary tract infection. What sign might you notice instead of a fever?","New confusion","Better appetite","Slower breathing","Lower blood sugar","Older adults often do not run a fever. New confusion or sudden weakness can be the first sign. Report it to the nurse right away."]);


/* CDL */
q("c1","cdl","alc",1,1,["commercial motor vehicle (CMV)","machin komèsyal"],
 ["Ki limit alkòl nan san pou yon chofè k ap kondui yon machin komèsyal (CMV)?","0.02%","0.04%","0.06%","0.08%","Limit federal la pou yon machin komèsyal se 0.04%, mwatye limit pou pifò chofè machin."],
 ["What is the blood alcohol limit for a driver operating a commercial motor vehicle (CMV)?","0.02%","0.04%","0.06%","0.08%","The federal limit in a commercial motor vehicle is 0.04%, half the limit for most car drivers."]);
q("c2","cdl","drive",1,1,["following distance","distans dèyè"],
 ["Kamyon w lan gen 40 pye longè epi w ap kondui anba 40 mph. Ki tan minimòm pou w kite ant ou ak machin devan w?","2 segonn","4 segonn","6 segonn","8 segonn","Kite 1 segonn pou chak 10 pye longè machin nan anba 40 mph. Pi wo pase 40 mph, ajoute 1 segonn anplis (5 segonn isit la)."],
 ["Your truck is 40 feet long and you are driving under 40 mph. What is the minimum following time?","2 seconds","4 seconds","6 seconds","8 seconds","Leave 1 second for each 10 feet of vehicle length below 40 mph. Over 40 mph, add 1 more second (5 seconds here)."]);
q("c3","cdl","insp",2,1,["tread depth","pwofondè tras"],
 ["Ki pwofondè minimòm tras kawotchou devan yo (direksyon) dwe genyen?","1/32 pous","2/32 pous","4/32 pous","6/32 pous","Kawotchou devan yo bezwen omwen 4/32 pous tras nan chak gwo kannal. Lòt kawotchou yo bezwen omwen 2/32 pous."],
 ["What is the minimum tread depth for front (steering) tires?","1/32 inch","2/32 inch","4/32 inch","6/32 inch","Front tires need at least 4/32 inch of tread in every major groove. Other tires need at least 2/32 inch."]);
q("c4","cdl","air",0,1,["air brakes","fren lè"],
 ["Alam presyon lè ki ba a dwe limen anvan presyon an desann anba:","60 psi","80 psi","100 psi","125 psi","Yon limyè oswa yon sonnri dwe limen anvan presyon lè nan tank yo desann anba 60 psi."],
 ["The low air pressure warning must come on before pressure drops below:","60 psi","80 psi","100 psi","125 psi","A warning light or buzzer must come on before air pressure in the tanks falls below 60 psi."]);
q("c5","cdl","emerg",0,1,["warning triangles","triyang avètisman"],
 ["Apre w kanpe sou wout la, nan konbyen tan ou dwe mete triyang avètisman yo?","Anvan 10 minit","Anvan 30 minit","Anvan 1 èdtan","Sèlman lannwit","Mete triyang avètisman yo anvan 10 minit apre w kanpe. Limen limyè ijans kat bò yo touswit."],
 ["After you stop on the road, how soon must you put out warning triangles?","Within 10 minutes","Within 30 minutes","Within 1 hour","Only at night","Place warning devices within 10 minutes of stopping. Turn on your four-way flashers right away."]);
q("c6","cdl","air",2,0,["spring brakes","fren resò"],
 ["Sou pifò gwo machin, fren resò (spring brakes) yo mete pou kont yo lè presyon lè desann a anviwon:","90–100 psi","60–80 psi","20–45 psi","Anba 5 psi","Lè presyon tank yo tonbe ant 20 ak 45 psi, fren resò yo mete. Kanpe san danje anvan presyon an desann konsa."],
 ["On most heavy vehicles, spring brakes come on automatically when air pressure drops to about:","90–100 psi","60–80 psi","20–45 psi","Below 5 psi","When tank pressure falls into the 20–45 psi range, the spring brakes apply. Stop safely before pressure gets that low."]);
q("c7","cdl","drive",1,0,["downgrade","desant"],
 ["Anvan w desann yon long pant ki rèd, ou dwe:","Mete l nan pwen mò pou ekonomize gaz","Mete yon vitès pi ba anvan w kòmanse desann","Peze fren pandan tout desant lan","Akselere pou desann pi vit","Chwazi yon vitès ki ba anvan desant lan. Si w kenbe pye w sou fren an, fren yo chofe epi yo ka pèdi fòs (brake fade)."],
 ["Before going down a long, steep grade, you should:","Shift into neutral to save fuel","Shift into a lower gear before starting down","Use the brakes the whole way","Speed up to get down faster","Choose a low gear before the downgrade. Riding the brakes overheats them and causes brake fade, which can make them fail."]);
q("c8","cdl","drive",1,0,["railroad crossing","kwazman ray tren"],
 ["Lè w dwe kanpe nan yon kwazman ray tren, a ki distans ray ki pi pre a pou w kanpe?","5 a 10 pye","15 a 50 pye","60 a 100 pye","Plis pase 100 pye","Kanpe ant 15 ak 50 pye de ray ki pi pre a. Gade epi koute de bò anvan w travèse, epi pa chanje vitès sou ray yo."],
 ["When you must stop at a railroad crossing, how far from the nearest rail should you stop?","5 to 10 feet","15 to 50 feet","60 to 100 feet","More than 100 feet","Stop 15 to 50 feet from the nearest rail. Look and listen both ways before crossing, and do not shift gears on the tracks."]);
q("c9","cdl","cargo",2,0,["cargo securement","atach chajman"],
 ["Apre w kòmanse yon vwayaj, ki lè pou w tcheke chajman an ak atach li yo an premye?","Apre 500 mil","Sèlman nan fen vwayaj la","Nan 50 premye mil yo","Sèlman si w tande bri","Tcheke chajman an nan 50 premye mil yo, apre sa chak 150 mil oswa chak 3 èdtan, sa ki rive an premye."],
 ["After starting a trip, when should you first re-check your cargo and securement?","After 500 miles","Only at the end of the trip","Within the first 50 miles","Only if you hear noise","Check cargo within the first 50 miles, then every 150 miles or every 3 hours, whichever comes first."]);
q("c10","cdl","emerg",1,0,["fire extinguisher","ekstentè"],
 ["Ki kalite ekstentè yo itilize pou dife elektrik?","A","B:C","Dlo sèlman","Kim sèlman","Sèvi ak yon ekstentè B:C pou dife elektrik ak likid k ap boule. Pa janm mete dlo sou yon dife elektrik."],
 ["Which type of fire extinguisher is used on electrical fires?","A","B:C","Water only","Foam only","Use a B:C extinguisher on electrical and burning-liquid fires. Never use water on an electrical fire."]);
q("c11","cdl","air",3,0,["governor cut-out","gouvènè (cut-out)"],
 ["Gouvènè konpresè lè a konn sispann ponpe lè (cut-out) a anviwon:","60 psi","80 psi","100 psi","125 psi","Cut-out la konn rive anviwon 125 psi. Tcheke manyèl machin ou; chif yo ka varye."],
 ["The air compressor governor usually stops pumping air (cut-out) at about:","60 psi","80 psi","100 psi","125 psi","Cut-out is usually around 125 psi. Check your vehicle's manual, since values can vary."]);
q("c12","cdl","insp",0,0,["pre-trip inspection","enspeksyon anvan vwayaj"],
 ["Kisa ki objektif prensipal yon enspeksyon anvan vwayaj (pre-trip)?","Jwenn pwoblèm ki ka lakòz aksidan oswa pàn","Netwaye kamyon an","Note konbyen gaz ou itilize","Tcheke radyo a","Yon enspeksyon anvan vwayaj jwenn pwoblèm sekirite anvan w kondui. Lwa a mande pou w asire w machin nan san danje anvan w pati."],
 ["What is the main purpose of a pre-trip inspection?","To find problems that could cause a crash or breakdown","To clean the truck","To log fuel use","To check the radio","A pre-trip inspection finds safety problems before you drive. The law requires you to be sure the vehicle is safe before you leave."]);

const GUIDES=[
 {id:"g-cna-inf",t:"cna",free:1,title:{ht:"Kontwòl enfeksyon",en:"Infection control"},
  blueprint:{ht:"Egzamen ekri MA: 4 kesyon sou 60 soti nan sijè sa a. Lave men parèt nan chak tès konpetans.",en:"MA written exam: 4 of 60 questions come from this topic. Handwashing is part of every skills test."},
  check:["cna14","cna15","cna16","cna17","cna18"],src:["S1","S2","S3","S4","S5"],
  sections:[
   {h:{ht:"Chèn enfeksyon an",en:"The chain of infection"},src:["S1"],b:[
    ["p","Yon enfeksyon pase de yon moun a yon lòt nan sis etap ki rele chèn enfeksyon an. Si w kase nenpòt maiyon, enfeksyon an pa ka pase.","An infection spreads through six links called the chain of infection. Break any one link and the infection cannot spread."],
    ["n","Mikwòb (infectious agent): bakteri, viris, chanpiyon oswa parazit ki lakòz maladi. Ou kase l lè w netwaye epi dezenfekte.","Infectious agent: bacteria, viruses, fungi or parasites that cause disease. You break it by cleaning and disinfecting."],
    ["n","Rezèvwa (reservoir): kote mikwòb la viv epi miltipliye, tankou yon moun malad, yon bèt oswa dlo ki chita. Yon moun ka pote mikwòb san l pa malad (carrier). Ou kase l lè w kenbe anviwònman an pwòp epi manyen twal sal yo byen.","Reservoir: where the germ lives and multiplies, such as a sick person, an animal or standing water. A person can carry a germ without being sick (a carrier). You break it by keeping the environment clean and handling soiled linens safely."],
    ["n","Pòt sòti (portal of exit): kijan mikwòb la soti, tankou nen, bouch oswa yon blesi. Ou kase l lè w kouvri touse epi kenbe likid kò yo fèmen.","Portal of exit: how the germ leaves, such as the nose, mouth or a wound. You break it by covering coughs and containing body fluids."],
    ["n","Mòd transmisyon (mode of transmission): kijan mikwòb la vwayaje: kontak, gout oswa lè. Se maiyon ou kontwole plis la: lave men w epi mete PPE.","Mode of transmission: how the germ travels: by contact, droplets or air. This is the link you control most: hand hygiene and PPE."],
    ["n","Pòt antre (portal of entry): kote mikwòb la antre nan yon lòt moun, tankou po ki blese, bouch, oswa yon sonn pipi (catheter). Ou kase l lè w pwoteje po a epi fè swen katetè ak swen pati entim byen.","Portal of entry: where the germ gets into a new person, such as broken skin, the mouth or a urinary catheter. You break it by protecting the skin and giving catheter and perineal care correctly."],
    ["n","Moun ki fasil pran l (susceptible host): moun ki gen defans fèb, tankou granmoun 65 an oswa plis ak moun ki gen maladi kwonik tankou dyabèt. Prèske tout rezidan fè pati gwoup sa a.","Susceptible host: a person with weak defenses, such as adults 65 and older and people with chronic illness like diabetes. Nearly every resident is in this group."]]},
   {h:{ht:"Ijyèn men",en:"Hand hygiene"},src:["S3","S5"],b:[
    ["p","Ijyèn men se pi bon fason pou anpeche enfeksyon pase. Gen de fason: savon ak dlo, oswa yon dezenfektan men ki gen alkòl.","Hand hygiene is the best way to stop infections from spreading. There are two ways: soap and water, or an alcohol-based hand sanitizer."],
    ["li","Sèvi ak savon ak dlo lè men w sal yon fason ou ka wè, anvan w manje, apre w sèvi ak twalèt, epi lè yon rezidan gen C. diff oswa norovirus.","Use soap and water when your hands are visibly soiled, before eating, after using the restroom, and when a resident has C. diff or norovirus."],
    ["li","Nan pifò lòt sitiyasyon, dezenfektan ki gen omwen 60% alkòl prefere. Fwote tout pati men w jiskaske yo sèk, anviwon 20 segonn.","In most other situations, sanitizer with at least 60% alcohol is preferred. Rub all surfaces until your hands are dry, about 20 seconds."],
    ["li","Sou egzamen konpetans Massachusetts la, ou dwe fwote men w ak savon omwen 20 segonn. Se yon etap kle nan tès la.","On the Massachusetts skills test, you must scrub with soap for at least 20 seconds. It is a key step on the test."],
    ["p","Lè pou fè ijyèn men:","When to clean your hands:"],
    ["li","Anvan w touche yon rezidan.","Right before touching a resident."],
    ["li","Lè w pase de yon pati sal rive nan yon pati pwòp sou menm rezidan an.","When moving from a soiled to a clean body area on the same resident."],
    ["li","Apre w touche yon rezidan oswa bagay ki bò kote l.","After touching a resident or their surroundings."],
    ["li","Apre kontak ak san, likid kò oswa sifas ki kontamine.","After contact with blood, body fluids or contaminated surfaces."],
    ["li","Touswit apre w retire gan.","Right after removing gloves."]]},
   {h:{ht:"Prekosyon estanda",en:"Standard precautions"},src:["S1","S2"],b:[
    ["p","Prekosyon estanda yo pou tout rezidan, chak fwa. Konsidere tout san, tout likid kò (sòf swè), po ki blese ak andedan nen, bouch ak je kòm si yo ka gen mikwòb.","Standard precautions apply to every resident, every time. Treat all blood, body fluids (except sweat), broken skin and mucous membranes as if they could carry germs."],
    ["li","Ijyèn men.","Hand hygiene."],
    ["li","PPE lè w ka ekspoze a san oswa likid kò.","PPE when you could be exposed to blood or body fluids."],
    ["li","Ijyèn respiratwa: kouvri touse ak estènye.","Respiratory hygiene: cover coughs and sneezes."],
    ["li","Netwaye ak dezenfekte ekipman ak anviwònman an.","Clean and disinfect equipment and the environment."],
    ["li","Manyen twal ak lenn sal avèk prekosyon.","Handle soiled linens and laundry carefully."]]},
   {h:{ht:"Prekosyon selon transmisyon",en:"Transmission-based precautions"},src:["S1","S2"],b:[
    ["p","Yo ajoute prekosyon sa yo sou prekosyon estanda yo lè yon rezidan gen yon enfeksyon, oswa yo sispèk li genyen youn.","These are added on top of standard precautions when a resident has, or may have, an infection."],
    ["li","Kontak: gan ak rad izolasyon. Egzanp: C. diff, MRSA.","Contact: gloves and gown. Examples: C. diff, MRSA."],
    ["li","Gout (droplet): yon mask. Egzanp: grip. Gout yo ka vwayaje anviwon 6 pye.","Droplet: a mask. Example: the flu. Droplets can travel about 6 feet."],
    ["li","Lè (airborne): yon respiratè tankou N95 ak yon chanm espesyal. Egzanp: tibèkiloz, lawoujòl.","Airborne: a respirator such as an N95 and a special room. Examples: tuberculosis, measles."],
    ["p","Ensiy sou pòt la pa di non maladi a, pou pwoteje vi prive rezidan an. Si w pa konnen ki PPE pou w mete, mande enfimyè a anvan w antre.","The sign on the door does not name the disease, to protect the resident's privacy. If you are not sure which PPE to wear, ask the nurse before you go in."]]},

 if(!ids){const g=GUIDES.find(g=>g.check.includes(x.id));if(g)ids=g.src}
 if(!ids||!ids.length)return "";
 return `<p class="cite">${esc(U("srcLabel"))}: ${ids.map(id=>SRC[id]?`<a href="${SRC[id].url}" target="_blank" rel="noopener">${esc(SRC[id].name)}</a>`:"").join(" · ")}${pg?`, ${esc(U("pg"))} ${esc(pg)}`:""}</p>`}

/* Exam draw: follow the track's blueprint (questions per topic) when it has one; top up from other topics if a topic is short. */
function examDraw(t,pool){
 const tr=TR[t],ex=tr.exam||{n:10},bp=tr.blueprint;
 if(!bp)return pool.slice(0,Math.min(ex.n,pool.length));
 const pick=[],used=new Set();
 Object.keys(bp).forEach(a=>pool.filter(x=>x.tp===a).slice(0,bp[a]).forEach(x=>{pick.push(x);used.add(x.id)}));
 pool.forEach(x=>{if(pick.length<ex.n&&!used.has(x.id)){pick.push(x);used.add(x.id)}});
 return shuffle(pick);
}

/* Estimated score: accuracy on answered questions in each topic, weighted by the topic's share of the exam
   (the CNA blueprint) or equally (HHA). Shown once the learner has answered EST_MIN questions. */
const EST_MIN=20;
function estimate(t){const tr=TR[t],bp=tr.blueprint,tops=Object.keys(tr.topics);let w=0,acc=0,done=0,cov=0;
 tops.forEach(tp=>{const st=topicStats(t,tp);done+=st.done;if(!st.done)return;cov++;const k=bp?(bp[tp]||0):1;w+=k;acc+=k*st.ok/st.done});
 return {done,cov,n:tops.length,pct:w?Math.round(acc/w*100):null}}
/* The pass line: a bar with a brass tick at the passing score. v=null draws an empty bar. */
const gauge=(v,p,cls="")=>`<div class="gauge ${cls}${v!==null&&v>=p?" pass":""}" style="--v:${v===null?0:v}%;--p:${p}%" aria-hidden="true"><i></i><b></b></div>`;
function topicRow(t,tp){const tr=TR[t],st=topicStats(t,tp),p=Math.round(tr.pass*100),a=st.done?Math.round(st.ok/st.done*100):null;
 return `<button type="button" class="topic" data-act="practice" data-v="${tp}"><span>${LO(tr.topics[tp])}</span><span class="cnt ${a!==null&&a>=p?"ok":""}">${a===null?esc(U("notStarted")):esc(fill(U("pctRight"),{p:a}))}${st.avail<st.total?" "+lockIcon:""}</span>${gauge(a,p,"sm")}</button>`}

/* ---------- Sessions ---------- */
function fmt(ms){ms=Math.max(0,ms);const s=Math.ceil(ms/1000);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
function start(mode,t,tp,ids){
 const origin=["quiz","result"].includes(V.view)&&sess?sess.origin:Object.assign({},V);
 let pool=Q.filter(x=>x.t===t&&avail(x));
 if(ids)pool=ids.map(byId).filter(x=>x&&avail(x));
 else if(tp)pool=pool.filter(x=>x.tp===tp);
 if(mode==="missed")pool=Q.filter(x=>x.t===t&&avail(x)&&S.hist[x.id]&&S.hist[x.id].ok===false);
 if(!pool.length){go("practice",{msg:mode==="missed"?"noneMissed":"noneAvail"});return}
 pool=shuffle(pool);
 if(mode==="quick"){const rank=x=>{const h=S.hist[x.id];return !h?0:h.ok===false?1:2};pool.sort((a,b)=>rank(a)-rank(b));pool=pool.slice(0,10);mode="practice"}
 if(mode==="exam")pool=hasPrem(t)?examDraw(t,pool):pool.slice(0,Math.min(5,pool.length));
 const ex=TR[t].exam||{n:pool.length,min:pool.length};
 sess={mode,t,tp,ids,origin,list:pool.map(x=>x.id),i:0,ans:{},perm:{},end:mode==="exam"?Date.now()+Math.round(ex.min*60000*pool.length/ex.n):0,timeUp:false};
 pool.forEach(x=>sess.perm[x.id]=shuffle([0,1,2,3]));
 go("quiz");
}
function record(id,choice){const x=byId(id),h=S.hist[id]||{n:0};S.hist[id]={ok:choice===x.c,n:h.n+1}}
function finish(timeUp){
 if(sess.mode==="exam")sess.list.forEach(id=>{if(sess.ans[id]!==undefined)record(id,sess.ans[id]);else record(id,-1)});
 sess.timeUp=!!timeUp;save();go("result");
}
function speak(id){
 const x=byId(id);
 try{if(!("speechSynthesis" in window))return;speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(x.en[0]+" "+x.en.slice(1,5).map((a,i)=>"ABCD"[i]+". "+a).join(". "));u.lang="en-US";u.rate=.9;speechSynthesis.speak(u)}catch(e){}
}

 clearInterval(timer);
 if(!T()&&V.view!=="onboard")V={view:"onboard",step:S.track?1:0}; /* a user whose exam was parked goes straight to choosing an exam */
 const ob=V.view==="onboard";
 document.body.classList.toggle("ob",ob);
 document.body.classList.toggle("focus",V.view==="quiz");
 document.documentElement.lang=S.lang==="both"?"ht":S.lang;
 document.getElementById("langSel").value=S.lang;

 const off=document.getElementById("offline");off.hidden=navigator.onLine!==false;off.textContent=U("offline");
 const tc=document.getElementById("trackChip");tc.hidden=ob||!T();if(T())tc.querySelector("b").textContent=TR[T()].code;
 document.querySelectorAll("[data-ui]").forEach(el=>el.textContent=U(el.dataset.ui));
 const tab={home:"home",switch:"home",faq:"home",quiz:"practice",result:"practice",practice:"practice",learn:"learn",guide:"learn",glossary:"learn",account:"account",auth:"account",upgrade:"account",sources:"account"}[V.view];
 document.querySelectorAll("nav.tabs button").forEach(b=>b.dataset.v===tab?b.setAttribute("aria-current","page"):b.removeAttribute("aria-current"));
 document.getElementById("app").innerHTML=views[V.view]();
 if(V.view==="quiz"&&sess.mode==="exam"){
  timer=setInterval(()=>{const left=sess.end-Date.now(),el=document.getElementById("timer");
   if(left<=0){clearInterval(timer);finish(true);return}
   if(el){el.textContent=fmt(left);el.classList.toggle("low",left<60000)}},1000);

}

 obDone:()=>{const d=document.getElementById("obd").value;S.examDate=d||null;save();go("home")},
 obSkip:()=>{S.examDate=null;save();go("home")},
 setTrack:v=>{if(!TR[v]||TR[v].soon)return;S.track=v;save();go("home")},
 quick:()=>start("quick",T()),
 practice:v=>start("practice",T(),v||null),
 exam:()=>start("exam",T()),
 missed:()=>start("missed",T()),
 pick:v=>{const id=sess.list[sess.i];v=+v;if(sess.mode!=="exam"){if(sess.ans[id]!==undefined)return;sess.ans[id]=v;record(id,v);save()}else sess.ans[id]=v;render();
  const fb=document.getElementById("fb");if(fb){const calm=matchMedia("(prefers-reduced-motion: reduce)").matches;fb.scrollIntoView({block:"nearest",behavior:calm?"auto":"smooth"})}},
 retryWrong:()=>{const ids=sess.list.filter(id=>sess.ans[id]!==byId(id).c);start("practice",sess.t,null,ids)},
 next:()=>{if(sess.i<sess.list.length-1){sess.i++;render();window.scrollTo(0,0)}else finish(false)},
 quit:()=>{const o=sess&&sess.origin;go(o&&o.view&&views[o.view]&&!["quiz","result"].includes(o.view)?o.view:"practice",o)},
 restart:()=>start(sess.mode,sess.t,sess.tp,sess.ids),
 openGuide:v=>go("guide",{g:v}),
 openSec:v=>{const [g,i]=v.split("|");go("guide",{g,sec:+i,from:V.view==="quiz"||V.view==="result"?V.view:null});const el=document.getElementById("sec-"+i);if(el)el.scrollIntoView({block:"start"})},
 backFrom:()=>{go(V.from)},
 guideCheck:v=>{const g=GUIDES.find(x=>x.id===v);if(g.t==="hha"&&T()==="cna"){const ids=g.check.map(i=>"c-"+i).filter(byId);start("practice","cna",null,ids.length?ids:Q.filter(x=>x.t==="cna"&&x.g===g.id).slice(0,5).map(x=>x.id));return}start("practice",g.t,null,g.check)},
 listen:v=>speak(v),
 allTerms:()=>go("glossary",{all:!V.all}),
 reset:()=>{if(!confirm(U("resetQ")))return;Q.filter(x=>x.t===T()).forEach(x=>delete S.hist[x.id]);save();render()},
 signOut:()=>{Acct.signOut();render()},
 delAcct:()=>{if(!confirm(U("delQ")))return;/* TODO: call delete-account Edge Function, then sign out */Acct.signOut();S.ent={};save();render()},
 google:()=>{Acct.signInGoogle();H.authBack()},
 emailIn:()=>{const e=document.getElementById("em"),v=e.value.trim();if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)){e.focus();e.setAttribute("aria-invalid","true");return}Acct.signInEmail(v);H.authBack()},
 authBack:()=>{const n=V.next;if(n&&Acct.user()){go(n.view,n)}else go(n?n.view:"account",n||{})},
 buy:v=>{if(!Acct.user()){go("auth",{why:1,next:{view:"upgrade"}});return}Acct.buy(v,T());render()}
};
document.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b)return;const f=H[b.dataset.act];if(f)f(b.dataset.v,b)});
document.addEventListener("change",e=>{const c=e.target.closest("[data-chg]");if(c&&H[c.dataset.chg])H[c.dataset.chg](c.value)});
render();
needLang(S.lang,render);
window.addEventListener("online",render);window.addEventListener("offline",render);
/* Offline support: works when the app is served over http(s), e.g. GitHub Pages. Fails quietly where service workers are not allowed. */
if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol)){try{navigator.serviceWorker.register("sw.js").catch(()=>{})}catch(e){}}
